# loop13: grounded QA SFT — RAG文脈+質問→短答の形式学習（docs/loop-13-plan.md）
# sft_lora.yaml（loop1-9実機確認済み）をベースに、データと系列長のみ変更。
# 実行: make grounded-sft（= make sft SFT_CFG=/pipeline/s4_sft/sft_grounded.yaml）
# 前提: make grounded-build 済み（/data/pretrain/grounded/ が存在）
sft:
  max_num_epochs: 2            # ~1,700例/gbs32 ≈ 53step/epoch。形式学習に多epochは不要
  max_num_steps: 150
  val_period: 25
  val_batches: 8
  val_global_batch_size: 16
  val_micro_batch_size: 1
  val_at_start: true           # 学習前のval loss=baseの位置を記録
  val_at_end: true
  seed: 42

checkpointing:
  enabled: true
  # loop8罠対策: 過去SFTの step_* が残る /ckpt/sft を使わず専用dirに分離
  # （checkpoint_dir に前回 step_* が残ると自動レジュームで pickle エラー死）
  checkpoint_dir: /ckpt/sft_grounded
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 2
  save_period: 50              # spot中断前提で細かめに保存
  checkpoint_must_save_by: null
  save_optimizer: true

policy:
  model_name: nvidia/NVIDIA-Nemotron-Nano-9B-v2-Japanese
  tokenizer:
    name: ${policy.model_name}
    chat_template: "default"   # v0.6.0: null は素通しの意味になるため "default" 明示（実機確認済み）
    chat_template_kwargs: null
  train_global_batch_size: 32
  train_micro_batch_size: 1
  # RAG文脈は top5×800字≈4,000字+質問。2560では大半が超過（loss_multiplier=0で無効化）
  # されるため4096が必要。ゲートA実機(2026-08-12): 1GPUはbackwardでOOM（43.46/44.39GiB使用・
  # 1.89GiB要求・expandable_segments込み）→ gpus_per_node 2 + TP=2 で活性化を分割
  max_total_sequence_length: 4096
  precision: "bfloat16"

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 2
    context_parallel_size: 1
    dp_replicate_size: 1
    custom_parallel_plan: null
    automodel_kwargs: {}
    lora_cfg:
      enabled: true
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 16
      alpha: 32
      dropout: 0.0          # TP=2でLoRA dropoutがPartial未対応(aten.native_dropout・ゲートA実機)
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: false     # TP>1非対応(NeMo-RLのassert・ゲートA実機)

  megatron_cfg:
    enabled: false
    use_linear_ce_fusion_loss: false

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    sequence_length_round: 64
  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      # 非退行③重視で sft_lora.yaml(5e-5) より弱め。データも~1,700例と多く低lrで足りる
      lr: 2.0e-5
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1e-5
      foreach: false
      fused: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  shuffle: true
  num_workers: 1
  add_generation_prompt: true  # 推論時(vLLM)と同じ境界で応答が始まる（実機確認済み）
  # 単一タスク・単一システムプロンプト。プロンプトは probe_qa.py --rag の評価時描画と
  # 同一（build_grounded_sft.py が RAG_SYS/build_rag_user を import して生成）
  train:
    - dataset_name: ResponseDataset
      data_path: /data/pretrain/grounded/sft_grounded_train.jsonl
      input_key: input
      output_key: output
      system_prompt_file: /data/pretrain/grounded/prompts/grounded_sys.txt
  validation:
    - dataset_name: ResponseDataset
      data_path: /data/pretrain/grounded/sft_grounded_valid.jsonl
      input_key: input
      output_key: output
      system_prompt_file: /data/pretrain/grounded/prompts/grounded_sys.txt
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"  # 必須: 未指定だと math用プロセッサになる（v0.6.0実機確認）

logger:
  log_dir: /results/logs/sft_grounded
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: true
  swanlab_enabled: false
  monitor_gpus: true
  tensorboard:
    log_dir: /results/tb/sft_grounded
  mlflow:
    experiment_name: nemo-sft
    run_name: sft-grounded-lora
    tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://host.docker.internal:5000}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 2             # ゲートA実機: seq4096は1GPU(L40S 44GB)でOOM実測 → TP=2で分割
  num_nodes: 1
