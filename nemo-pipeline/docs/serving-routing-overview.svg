<svg viewBox="0 0 1120 500" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0D9488"/></marker>
  </defs>
  <rect width="1120" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1120" height="60" fill="#0D9488"/>
  <text x="28" y="30" fill="#FFFFFF" font-size="20" font-weight="700">使う（推論構成）— モデルの使い分け・RAG・ルーティング・フォールバック</text>
  <text x="28" y="49" fill="#CFF0E9" font-size="12.5">学習パイプラインとは別。複数モデルを役割で使い分ける実行時アーキテクチャ（アプリ = local-rag-llm）</text>

  <!-- Guardrail frame (S7 wraps input->process->output) -->
  <rect x="20" y="78" width="1080" height="322" rx="12" fill="#FBF9FE" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="7 4"/>
  <rect x="36" y="70" width="360" height="20" rx="6" fill="#7C3AED"/>
  <text x="46" y="84" fill="#FFFFFF" font-size="11" font-weight="600">S7 ガードレール：入力 →[処理]→ 出力 を挟む</text>
  <text x="1084" y="96" text-anchor="end" fill="#7C3AED" font-size="10.5">監視 = Langfuse</text>

  <!-- User -->
  <rect x="44" y="196" width="118" height="60" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="103" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">ユーザー質問</text>
  <text x="103" y="240" text-anchor="middle" font-size="10" fill="#6B7280">（入力レール適用）</text>

  <!-- LiteLLM gateway -->
  <rect x="192" y="196" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="267" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">LiteLLM ゲートウェイ</text>
  <text x="267" y="238" text-anchor="middle" font-size="10" fill="#6B7280">全LLM呼び出しの関所</text>

  <!-- routing note -->
  <rect x="192" y="300" width="150" height="40" rx="6" fill="#ECFBF7" stroke="#C2EFE3"/>
  <text x="267" y="317" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0D9488">ルーティング</text>
  <text x="267" y="332" text-anchor="middle" font-size="9.5" fill="#6B7280">易→ローカル / 難→Claude</text>

  <!-- Analysis (small model) -->
  <rect x="398" y="118" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="488" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">クエリ解析（軽量）</text>
  <text x="488" y="157" text-anchor="middle" font-size="9.5" fill="#6B7280">sectors/日付/種別に構造化</text>

  <!-- RAG retrieval -->
  <rect x="398" y="278" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="488" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">RAG検索（pgvector）</text>
  <text x="488" y="317" text-anchor="middle" font-size="9.5" fill="#6B7280">関連チャンク取得（取得レール）</text>

  <!-- Generation (Nemotron) -->
  <rect x="620" y="196" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="710" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">回答生成</text>
  <text x="710" y="238" text-anchor="middle" font-size="9.5" fill="#6B7280">Nemotron 9B（vLLM）</text>

  <!-- Quality gate -->
  <rect x="838" y="196" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="913" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">品質ゲート</text>
  <text x="913" y="238" text-anchor="middle" font-size="9.5" fill="#6B7280">source_exists=100%</text>

  <!-- User out (合格) -->
  <rect x="838" y="106" width="150" height="52" rx="8" fill="#ECFBF7" stroke="#0D9488" stroke-width="1.5"/>
  <text x="913" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">利用者へ</text>
  <text x="913" y="145" text-anchor="middle" font-size="9.5" fill="#6B7280">出典付き回答（出力レール）</text>

  <!-- Claude fallback -->
  <rect x="838" y="300" width="150" height="60" rx="8" fill="#FFF7ED" stroke="#374151" stroke-width="1.4"/>
  <text x="913" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Claude API</text>
  <text x="913" y="342" text-anchor="middle" font-size="9.5" fill="#6B7280">難ケース / フォールバック</text>

  <!-- arrows -->
  <line x1="162" y1="226" x2="190" y2="226" stroke="#334155" stroke-width="1.6" marker-end="url(#b)"/>
  <!-- gateway branches to analysis & rag -->
  <path d="M342,214 L398,146" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M342,238 L398,306" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <!-- analysis & rag into generation -->
  <path d="M578,146 L620,214" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M578,306 L620,238" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <!-- generation -> gate -->
  <line x1="800" y1="226" x2="836" y2="226" stroke="#334155" stroke-width="1.6" marker-end="url(#b)"/>
  <!-- gate -> user (合格) -->
  <path d="M913,196 L913,160" fill="none" stroke="#0D9488" stroke-width="1.7" marker-end="url(#g)"/>
  <text x="924" y="182" font-size="10" fill="#0D9488" font-weight="600">合格</text>
  <!-- gate -> claude (不合格) -->
  <path d="M913,256 L913,298" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="924" y="282" font-size="10" fill="#94A3B8">不合格/難</text>
  <!-- claude -> user -->
  <path d="M988,318 L1020,318 L1020,132 L990,132" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#b)"/>

  <!-- footnote -->
  <text x="44" y="384" font-size="10.5" fill="#6B7280">※ 3モデルを役割分担: 解析=軽量 / 生成=Nemotron 9B(ローカル) / 難ケース=Claude。品質ゲート不合格やローカル障害時は自動でClaudeにフォールバック（2層）。</text>

  <text x="44" y="402" font-size="10.5" fill="#7C3AED">＋（任意）出口ガバナンス：全外部呼び出しを OpenShell の privacy router に集約し、宛先allowlist・認証情報分離・監査を"アプリ外"で強制（docs/07・アルファ）。</text>
  <!-- link back -->
  <text x="28" y="426" font-size="11" fill="#0D9488" font-weight="600">↑ 学習（作る）と評価は別図「パイプライン全体像（architecture-overview.svg）」を参照。合格した学習済みモデルがこの「回答生成」に載る。</text>
</svg>
