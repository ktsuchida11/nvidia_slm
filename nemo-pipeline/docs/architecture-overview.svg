<svg viewBox="0 0 1120 664" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/></marker>
  </defs>
  <rect width="1120" height="664" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1120" height="70" fill="#1E2A3A"/>
  <text x="28" y="32" fill="#FFFFFF" font-size="22" font-weight="700">ローカルLLM パイプライン全体像 — 作る・使う・守る</text>
  <rect x="946" y="40" width="15" height="15" rx="3" fill="#76B900"/>
  <text x="968" y="52" fill="#AAB7C8" font-size="11">＝ NVIDIA NeMo ライブラリ</text>
  <text x="28" y="56" fill="#AAB7C8" font-size="13">Linuxコンテナ完結 ・ Kubernetes不要 ・ 学習は Colab/借りGPU/ローカル64GB ・ 推論と検査はローカル</text>

  <!-- Eval-first strip -->
  <rect x="28" y="80" width="1064" height="30" rx="6" fill="#EEF2F7" stroke="#CBD5E1"/>
  <text x="42" y="100" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#0F766E">評価ファースト（S0）</tspan> ： 指標・閾値・held-out評価セットを最初に固定 → S6 で base / SFT / GRPO を同一基準で合否判定（前回の失敗＝評価を最後に回した、の再発防止）</text>

  <!-- ============ BAND 1: 作る / CPU ============ -->
  <rect x="28" y="120" width="1064" height="126" rx="10" fill="#F4F8FE" stroke="#D3E3FB"/>
  <rect x="28" y="120" width="6" height="126" rx="3" fill="#2563EB"/>
  <text x="46" y="142" font-size="13" font-weight="700" fill="#2563EB">① 作る ｜ ローカルLinux（K8s不要）… 文書抽出(S1e: OCR/VLMキャプション=docs/08)→S1→S2</text>

  <rect x="48" y="154" width="150" height="76" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="123" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">生データ・文書</text>
  <text x="123" y="196" text-anchor="middle" font-size="10" fill="#6B7280">官公庁/EDINET/合成</text>
  <text x="123" y="211" text-anchor="middle" font-size="10" fill="#6B7280">PPTX/PDF(図表)</text>

  <rect x="228" y="154" width="256" height="76" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="356" y="180" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S1 収集・管理</text>
  <text x="356" y="199" text-anchor="middle" font-size="10.5" fill="#6B7280">正規化・品質・PIIマスク</text>
  <text x="356" y="214" text-anchor="middle" font-size="10.5" fill="#6B7280">ライセンスゲート・重複排除</text>

  <rect x="514" y="154" width="276" height="76" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="652" y="180" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S2 蒸留・メタデータ</text>
  <text x="652" y="199" text-anchor="middle" font-size="10.5" fill="#6B7280">教師=Claude・スキーマ検証</text>
  <text x="652" y="214" text-anchor="middle" font-size="10.5" fill="#6B7280">忠実性ゲート・層別分割</text>

  <text x="812" y="180" font-size="11" fill="#334155" font-weight="600">出力 →</text>
  <text x="812" y="198" font-size="10.5" fill="#334155">train / valid（学習へ）</text>
  <text x="812" y="214" font-size="10.5" fill="#DC2626">held-out（評価専用）</text>

  <line x1="198" y1="192" x2="226" y2="192" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="484" y1="192" x2="512" y2="192" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- ============ BAND 2: 作る / GPU ============ -->
  <rect x="28" y="258" width="1064" height="120" rx="10" fill="#FEF6EA" stroke="#F7E2C0"/>
  <rect x="28" y="258" width="6" height="120" rx="3" fill="#D97706"/>
  <text x="46" y="280" font-size="13" font-weight="700" fill="#B45309">① 作る（続き）｜ GPUホスト（ローカル64GB or 借りGPU・Dockerのみ／学習はここだけ）</text>

  <rect x="48" y="292" width="210" height="72" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="153" y="320" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S3 事前学習 DAPT</text>
  <text x="153" y="340" text-anchor="middle" font-size="10.5" fill="#6B7280">（任意）継続事前学習</text>

  <rect x="288" y="292" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="388" y="320" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S4 SFT / LoRA</text>
  <text x="388" y="340" text-anchor="middle" font-size="10.5" fill="#6B7280">蒸留データで教師あり学習</text>

  <rect x="518" y="292" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="653" y="318" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S5 強化学習 GRPO</text>
  <text x="653" y="337" text-anchor="middle" font-size="10.5" fill="#6B7280">報酬=検証可能(source_exists/出典/数値/形式)</text>
  <text x="653" y="352" text-anchor="middle" font-size="10.5" fill="#6B7280">評価セットと分離（reward hacking対策）</text>

  <rect x="828" y="292" width="232" height="72" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="944" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">MLflow（閉域）</text>
  <text x="944" y="340" text-anchor="middle" font-size="10.5" fill="#6B7280">実験トラッキング / WandB不使用</text>

  <line x1="258" y1="328" x2="286" y2="328" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ad)"/>
  <line x1="488" y1="328" x2="516" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="788" y1="328" x2="826" y2="328" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ad)"/>

  <!-- S2 -> S4 (train/valid) -->
  <path d="M652,230 L652,258 M652,258 L388,258 L388,290" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <rect x="470" y="248" width="96" height="18" rx="4" fill="#F4F8FE" stroke="#CBD5E1"/>
  <text x="518" y="261" text-anchor="middle" font-size="10.5" fill="#334155">train / valid</text>

  <!-- ============ BAND 3: 使う（配信・評価まで。使い分けは別図） ============ -->
  <rect x="28" y="390" width="1064" height="100" rx="10" fill="#EBFAF6" stroke="#C2EFE3"/>
  <rect x="28" y="390" width="6" height="100" rx="3" fill="#0D9488"/>
  <text x="46" y="412" font-size="13" font-weight="700" fill="#0D9488">② 使う ｜ 学習済みモデルを配信し評価する（★アプリでのモデル使い分け・RAG・ルーティングは別図）</text>

  <rect x="48" y="424" width="160" height="54" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="128" y="447" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">学習済みモデル</text>
  <text x="128" y="464" text-anchor="middle" font-size="10.5" fill="#6B7280">checkpoint</text>

  <rect x="238" y="424" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="353" y="447" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">vLLM 配信</text>
  <text x="353" y="464" text-anchor="middle" font-size="10.5" fill="#6B7280">OpenAI互換・bf16 / fp8(任意)</text>

  <rect x="498" y="424" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="648" y="446" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">S6 評価</text>
  <text x="648" y="463" text-anchor="middle" font-size="10.5" fill="#6B7280">base vs SFT vs GRPO・閾値で合否(exit 0/2)</text>

  <rect x="828" y="424" width="232" height="54" rx="8" fill="#F0FbF8" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="944" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#0D9488">合格モデル → アプリ統合へ</text>
  <text x="944" y="460" text-anchor="middle" font-size="9.5" fill="#6B7280">使い分け/RAG/ルーティングは</text>
  <text x="944" y="472" text-anchor="middle" font-size="9.5" fill="#6B7280">別図「使う（推論構成）」参照</text>

  <path d="M600,364 L600,406 M600,406 L128,406 L128,422" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="208" y1="451" x2="236" y2="451" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="468" y1="451" x2="496" y2="451" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="798" y1="451" x2="826" y2="451" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <text x="812" y="444" font-size="10" fill="#0D9488">合格</text>

  <!-- held-out dashed S2 -> S6 -->
  <path d="M760,220 L868,220 L868,410 L648,410 L648,422" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="874" y="300" font-size="10.5" fill="#DC2626" font-weight="600">held-out</text>
  <text x="874" y="315" font-size="10" fill="#DC2626">（学習に</text>
  <text x="874" y="328" font-size="10" fill="#DC2626">使わない）</text>

  <!-- ============ BAND 4: 守る ============ -->
  <rect x="28" y="502" width="1064" height="96" rx="10" fill="#F6F1FE" stroke="#E5D8FB"/>
  <rect x="28" y="502" width="6" height="96" rx="3" fill="#7C3AED"/>
  <text x="46" y="524" font-size="13" font-weight="700" fill="#7C3AED">③ 守る ｜ ガードレール &amp; 監視（S7）— アプリの入出力を挟む多層防御（詳細は別図）</text>

  <rect x="48" y="536" width="252" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="174" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">入力レール</text>
  <text x="174" y="573" text-anchor="middle" font-size="10" fill="#6B7280">インジェクション / PII / スコープ</text>

  <rect x="314" y="536" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="464" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">取得レール（RAG固有）</text>
  <text x="464" y="573" text-anchor="middle" font-size="10" fill="#6B7280">チャンクの命令検出・信頼境界（間接注入対策）</text>

  <rect x="628" y="536" width="298" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="777" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">出力レール</text>
  <text x="777" y="573" text-anchor="middle" font-size="10" fill="#6B7280">忠実性 / PII / プロンプト漏洩 / スキーマ</text>

  <rect x="940" y="536" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="1000" y="556" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">garak / Langfuse</text>
  <text x="1000" y="573" text-anchor="middle" font-size="10" fill="#6B7280">攻撃検証・監視</text>

  <text x="46" y="595" font-size="9.5" fill="#7C3AED">＋（任意）出口ガバナンス OpenShell：通信・認証情報・実行を"アプリ外"でポリシー強制＋監査（会話レールと二層防御・docs/07・アルファ）</text>
  <!-- ============ Principles ============ -->
  <g font-size="11.5" font-weight="600">
    <rect x="48" y="612" width="242" height="34" rx="17" fill="#0F766E"/><text x="169" y="634" text-anchor="middle" fill="#FFFFFF">評価ファースト</text>
    <rect x="304" y="612" width="242" height="34" rx="17" fill="#2563EB"/><text x="425" y="634" text-anchor="middle" fill="#FFFFFF">検証可能報酬（GRPO）</text>
    <rect x="560" y="612" width="242" height="34" rx="17" fill="#D97706"/><text x="681" y="634" text-anchor="middle" fill="#FFFFFF">フォールバック常設（2層）</text>
    <rect x="816" y="612" width="244" height="34" rx="17" fill="#7C3AED"/><text x="938" y="634" text-anchor="middle" fill="#FFFFFF">多層防御（OWASP LLM Top10）</text>
  </g>

  <!-- NeMo library tags (NVIDIA green) -->
  <g fill="#FFFFFF" font-weight="600" text-anchor="middle">
    <rect x="63" y="231" width="120" height="14" rx="7" fill="#76B900"/><text x="123" y="241" font-size="8.5">S1e: NeMo Retriever</text>
    <rect x="303" y="231" width="106" height="14" rx="7" fill="#76B900"/><text x="356" y="241" font-size="9">NeMo Curator</text>
    <rect x="590" y="231" width="124" height="14" rx="7" fill="#76B900"/><text x="652" y="241" font-size="9">NeMo Curator（SDG）</text>
    <rect x="103" y="365" width="100" height="13" rx="6.5" fill="#76B900"/><text x="153" y="374.5" font-size="8.5">NeMo Framework</text>
    <rect x="338" y="365" width="100" height="13" rx="6.5" fill="#76B900"/><text x="388" y="374.5" font-size="8.5">NeMo Framework</text>
    <rect x="620" y="365" width="66" height="13" rx="6.5" fill="#76B900"/><text x="653" y="374.5" font-size="8.5">NeMo-RL</text>
    <rect x="599" y="479" width="98" height="12" rx="6" fill="#76B900"/><text x="648" y="488" font-size="8.5">NeMo Evaluator</text>
    <rect x="470" y="513" width="120" height="15" rx="7.5" fill="#76B900"/><text x="530" y="524" font-size="9.5">NeMo Guardrails</text>
  </g>
</svg>
