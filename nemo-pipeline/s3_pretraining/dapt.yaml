# S3 DAPT設定（dapt_train.py が読む自前スキーマ。NeMo 2.3 AutoModel経路）
# 配管検証(P3)はこのまま max_steps: 60。本走(P4)は max_steps をコーパス1epに合わせ再計算して承認を得る。
model:
  name: nvidia/NVIDIA-Nemotron-Nano-9B-v2-Japanese
  attn_implementation: sdpa        # ハイブリッド構成のためsdpa既定。flash_attention_2はP3で可否確認
  trust_remote_code: true
  enable_grad_ckpt: true

train:
  strategy: fsdp2
  devices: 4                       # g6e.12xlarge = L40S×4
  dp_size: 4
  tp_size: 1
  cp_size: 1
  cpu_offload: false               # 9B full-paramがOOMならtrue（それでも駄目ならpeft: lora）
  peft: none                       # none=full-param DAPT（知識注入の定石）/ lora=フォールバック
  lora_r: 64
  seq_len: 4096
  micro_batch: 1
  accumulate_grad_batches: 8       # 実効バッチ = dp4 × mbs1 × accum8 = 32seq ≈ 13万トークン/step
  lr: 1.0e-5                       # 継続事前学習の常用帯。忘却が出たら5e-6へ
  grad_clip: 1.0
  max_steps: 60                    # ★P3配管検証値（〜800万トークン）。P4本走は要再計算+承認
  val_check_interval: 30
  limit_val_batches: 50
  log_every: 1

data:
  train: /data/pretrain/corpus_train.jsonl
  val: /data/pretrain/corpus_val.jsonl

ckpt_dir: /ckpt/dapt

notes: |
  - 効果はS6で判定（①corpus_val loss低下 ②既存eval非退行 ③knowledge-probe。docs/loop-10-plan.md §5）。
  - held-out/評価データは絶対に混ぜない（prep_corpus.py のリーク検査が前段でmust）。
  - nemo:25.04 の transformers が NemotronH 未対応の場合は run_dapt.sh の DAPT_PIP_UPGRADE=1 で更新。
