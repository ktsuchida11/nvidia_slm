# S5 GRPO — analysis(ラベルJSON)タスク用設定（ループ8の1変更）。
# grpo_qwen.yaml（generation用）のコピーを基に、次の差分のみ変更:
#   - data: grpo_analysis_train.jsonl + label_sys.txt（システムプロンプト=学習/評価と同一）
#   - policy.model_name: /ckpt/sft/hf（convert-sft のマージ済みHF。/ckpt/sft 直下はDCPで直接読めない）
#   - generation.max_new_tokens: 400（s6_eval の analysis max_tokens と同一予算）
#   - grpo.max_num_steps: 40 / max_num_epochs: 2（小規模プローブ。~300件×16prompts/step≒19step/epoch）
# 報酬 = 0.2*schema + 0.15*sectors + 0.15*query_type + 0.5*date_range + penalty
# （finance_env.py が ground_truth の "label" キーで analysis 報酬に振り分ける）
# ★実機確認事項は grpo_qwen.yaml と同一（RL_IMGタグ / ResponseDataset→metadata受け渡し）
grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8    # OOM時の絞りノブ①: 8→4
  max_rollout_turns: 1
  max_num_epochs: 2
  max_num_steps: 40                # 小規模プローブ（train:reward が動かなければ次周でlr等を1変更）
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 10
  val_at_start: true               # 開始時点の報酬を基準線として記録（プローブ判定用）
  max_val_samples: 64
  val_batch_size: 64
  seed: 42

loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: "k3"
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  token_level_loss: true

checkpointing:
  enabled: true
  checkpoint_dir: /ckpt/grpo
  metric_name: "train:reward"      # 検証可能報酬の平均を追う（val環境も同一報酬）
  higher_is_better: true
  keep_top_k: 2
  save_period: 20                  # spot中断前提
  model_save_format: "safetensors"
  save_optimizer: true

policy:
  model_name: /ckpt/sft/hf         # ループ7 SFT成果（LoRAマージ済みHF）から開始
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null
  train_global_batch_size: 128
  train_micro_batch_size: 1
  generation_batch_size: 16
  logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 2048  # 絞りノブ③: 4096→2048 適用済み（48GBプロファイル）
  precision: "bfloat16"
  max_grad_norm: 1.0

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true # 絞りノブ④
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    automodel_kwargs: {}
    lora_cfg:                      # 絞りノブ④': LoRA必須（48GB）
      enabled: true
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 16
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: true

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64
  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 3.0e-7
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs: { start_factor: 0.1, end_factor: 1.0, total_iters: 13 }
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs: { factor: 1.0, total_iters: 10000000000 }
    - milestones: [13]

  generation:
    backend: "vllm"
    max_new_tokens: 400            # s6_eval の analysis 予算と同一
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.4  # 絞りノブ⑤適用済み（学習系と同居のため低め）
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
    vllm_kwargs: {}
    colocated:
      enabled: true                # 単一GPU: 生成と学習が同居
      resources: { gpus_per_node: null, num_nodes: null }

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 1
  train:
    # prep_rl_data.py の出力。ground_truth に {"label": {...}} のJSON文字列
    dataset_name: ResponseDataset
    data_path: /data/distilled/rl/grpo_analysis_train.jsonl
    input_key: input
    split_validation_size: 0.05    # train内から5%をGRPO用valに（heldoutは使わない・不可侵）
    seed: ${grpo.seed}
  validation: null
  default:
    prompt_file: null
    system_prompt_file: /data/distilled/rl/prompts/label_sys.txt
    env_name: "finance_grounding"  # run_grpo_finance.py が register_env する（analysis報酬へは gt キーで振り分け）

env:
  finance_grounding:
    num_workers: 2                 # 報酬は正規表現+JSONパースのみで軽量

logger:                            # クローズド網: 外部SaaSなし（W&B不使用）
  log_dir: /results/logs/grpo
  num_val_samples_to_print: 2
  wandb_enabled: false
  tensorboard_enabled: true        # 保険（make tensorboard で閲覧）
  mlflow_enabled: true             # 主役（セルフホストMLflow）
  swanlab_enabled: false
  monitor_gpus: true
  tensorboard:
    log_dir: /results/tb/grpo
  mlflow:
    experiment_name: nemo-rl-grpo
    run_name: grpo-analysis
    tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://host.docker.internal:5000}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 1                 # 48GB×1。9BをL40S×4で回す場合は4に
  num_nodes: 1
