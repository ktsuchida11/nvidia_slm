<svg viewBox="0 0 1180 812" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/></marker>
  </defs>
  <rect width="1180" height="812" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1180" height="72" fill="#1E2A3A"/>
  <text x="28" y="32" fill="#FFFFFF" font-size="22" font-weight="700">NeMo SLM パイプライン全体像 — 作る・足す・使う・守る（15周の実測反映）</text>
  <rect x="1000" y="42" width="15" height="15" rx="3" fill="#76B900"/>
  <text x="1022" y="54" fill="#AAB7C8" font-size="11">＝ NVIDIA NeMo</text>
  <text x="28" y="57" fill="#AAB7C8" font-size="12.5">Dockerのみ（K8s不要）・学習は AWS g6e spot（L40S 48GB／実効44GB）・CPU作業と評価はローカル・累計 ~$400</text>

  <!-- Eval-first strip (S0) -->
  <rect x="28" y="84" width="1124" height="30" rx="6" fill="#EEF2F7" stroke="#CBD5E1"/>
  <text x="42" y="104" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#0F766E">評価ファースト（S0）</tspan> ： 指標・閾値・held-out を最初に固定 → S6 で同一基準に合否判定。<tspan fill="#DC2626" font-weight="700">held-out / probe は学習・報酬・プロンプト例に一切使わない</tspan>（loop10 のリーク検査で実リーク223文書を検出）</text>

  <!-- ============ BAND 1: 作る / CPU ============ -->
  <rect x="28" y="126" width="1124" height="122" rx="10" fill="#F4F8FE" stroke="#D3E3FB"/>
  <rect x="28" y="126" width="6" height="122" rx="3" fill="#2563EB"/>
  <text x="46" y="148" font-size="13" font-weight="700" fill="#2563EB">① 作る ｜ CPU・ローカル（$0）… 生データ → S1 キュレーション → S2 蒸留</text>

  <rect x="48" y="160" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="123" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">生データ・文書</text>
  <text x="123" y="202" text-anchor="middle" font-size="10" fill="#6B7280">EDINET 有価証券報告書</text>
  <text x="123" y="217" text-anchor="middle" font-size="10" fill="#6B7280">PDF/PPTX（S1e 抽出）</text>

  <rect x="228" y="160" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="353" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S1 収集・キュレーション</text>
  <text x="353" y="203" text-anchor="middle" font-size="10.5" fill="#6B7280">正規化・PIIマスク・ライセンスゲート</text>
  <text x="353" y="218" text-anchor="middle" font-size="10.5" fill="#6B7280">重複排除（完全＋近似）</text>

  <rect x="508" y="160" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="633" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">S2 蒸留（学習データ生成）</text>
  <text x="633" y="203" text-anchor="middle" font-size="10.5" fill="#6B7280">教師 = Claude API・スキーマ検証</text>
  <text x="633" y="218" text-anchor="middle" font-size="10.5" fill="#6B7280">忠実性ゲート・層別分割</text>

  <text x="788" y="182" font-size="11" fill="#334155" font-weight="600">出力 →</text>
  <text x="788" y="200" font-size="10.5" fill="#334155">train / valid（学習へ）</text>
  <text x="788" y="216" font-size="10.5" fill="#DC2626" font-weight="600">held-out（評価専用・不可侵）</text>

  <rect x="960" y="168" width="180" height="58" rx="8" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1050" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">1周目の実測</text>
  <text x="1050" y="205" text-anchor="middle" font-size="9.5" fill="#B91C1C">generation 17/17件が「記載なし」</text>
  <text x="1050" y="219" text-anchor="middle" font-size="9.5" fill="#B91C1C">＝蒸留直後の目視で防げた</text>

  <line x1="198" y1="196" x2="226" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="478" y1="196" x2="506" y2="196" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- ============ BAND 2: 作る / GPU ============ -->
  <rect x="28" y="258" width="1124" height="118" rx="10" fill="#FEF6EA" stroke="#F7E2C0"/>
  <rect x="28" y="258" width="6" height="118" rx="3" fill="#D97706"/>
  <text x="46" y="280" font-size="13" font-weight="700" fill="#B45309">② 学習 ｜ GPUホスト（AWS g6e spot・課金ゲートあり）… 分布適応と形式の学習</text>

  <rect x="48" y="292" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="155" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">S3 継続事前学習 DAPT</text>
  <text x="155" y="331" text-anchor="middle" font-size="10" fill="#6B7280">分布適応: ppl 2.64→2.36（−10.6%）</text>
  <text x="155" y="346" text-anchor="middle" font-size="10" fill="#DC2626">知識注入は× probe 0.0402＝base同点</text>

  <rect x="293" y="292" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">S4 SFT / LoRA</text>
  <text x="400" y="331" text-anchor="middle" font-size="10" fill="#6B7280">担当＝出力の「形式」</text>
  <text x="400" y="346" text-anchor="middle" font-size="10" fill="#6B7280">アダプタ切替で用途別に分離</text>

  <rect x="538" y="292" width="270" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="673" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">S5 強化学習 GRPO</text>
  <text x="673" y="331" text-anchor="middle" font-size="10" fill="#6B7280">報酬＝検証可能（出典/数値/形式）・KL必須</text>
  <text x="673" y="346" text-anchor="middle" font-size="10" fill="#6B7280">学習セットは SFT と分ける（同一だと信号ゼロ）</text>

  <rect x="838" y="292" width="302" height="70" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="989" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">MLflow（閉域）／ 課金ゲート</text>
  <text x="989" y="331" text-anchor="middle" font-size="10" fill="#6B7280">概算 → 小規模実測 → 再見積り → 承認</text>
  <text x="989" y="346" text-anchor="middle" font-size="10" fill="#6B7280">ノードはループ間で停止しておく</text>

  <line x1="263" y1="327" x2="291" y2="327" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ad)"/>
  <line x1="508" y1="327" x2="536" y2="327" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- S2 -> S4 -->
  <path d="M633,232 L633,252 L400,252 L400,290" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <rect x="452" y="243" width="96" height="18" rx="4" fill="#F4F8FE" stroke="#CBD5E1"/>
  <text x="500" y="256" text-anchor="middle" font-size="10.5" fill="#334155">train / valid</text>

  <!-- ============ BAND 3: 知識を足す / RAG (S8) ============ -->
  <rect x="28" y="386" width="1124" height="120" rx="10" fill="#EEF6FF" stroke="#BFD8F7"/>
  <rect x="28" y="386" width="6" height="120" rx="3" fill="#1D4ED8"/>
  <text x="46" y="408" font-size="13" font-weight="700" fill="#1D4ED8">③ 知識を足す ｜ S8 検索拡張 RAG — 知識注入はここが正解（DAPT 見積り $300-550 に対し実測 $12）</text>

  <rect x="48" y="420" width="146" height="70" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="121" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">コーパス</text>
  <text x="121" y="462" text-anchor="middle" font-size="10" fill="#6B7280">202,318 チャンク</text>
  <text x="121" y="477" text-anchor="middle" font-size="10" fill="#6B7280">（S1 の出力を再利用）</text>

  <rect x="224" y="420" width="216" height="70" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="332" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">埋め込み・索引</text>
  <text x="332" y="462" text-anchor="middle" font-size="10" fill="#6B7280">embedding NIM（dim 2048）</text>
  <text x="332" y="477" text-anchor="middle" font-size="10" fill="#6B7280">自前フラット索引（中断再開可）</text>

  <rect x="470" y="420" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="570" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">検索（top k0=100）</text>
  <text x="570" y="462" text-anchor="middle" font-size="10" fill="#6B7280">recall / MRR で検索だけを測る</text>
  <text x="570" y="477" text-anchor="middle" font-size="10" fill="#DC2626">top100 圏外 16.6% ＝次の律速</text>

  <rect x="700" y="420" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="800" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">rerank → top10</text>
  <text x="800" y="462" text-anchor="middle" font-size="10" fill="#6B7280">reranking NIM</text>
  <text x="800" y="477" text-anchor="middle" font-size="10" fill="#6B7280">文脈は量より質（top5 &gt; k=10）</text>

  <rect x="930" y="420" width="210" height="70" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1035" y="441" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">probe 正答率の推移</text>
  <text x="1035" y="459" text-anchor="middle" font-size="10.5" fill="#374151">base / DAPT 0.0402</text>
  <text x="1035" y="475" text-anchor="middle" font-size="10.5" fill="#374151">RAG 0.4724 → +rerank <tspan font-weight="700" fill="#1D4ED8">0.6332</tspan></text>

  <line x1="194" y1="455" x2="222" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="440" y1="455" x2="468" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="670" y1="455" x2="698" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="900" y1="455" x2="928" y2="455" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- ============ BAND 4: 使う ============ -->
  <rect x="28" y="516" width="1124" height="104" rx="10" fill="#EBFAF6" stroke="#C2EFE3"/>
  <rect x="28" y="516" width="6" height="104" rx="3" fill="#0D9488"/>
  <text x="46" y="538" font-size="13" font-weight="700" fill="#0D9488">④ 使う ｜ 配信して評価する（実行時の使い分け・ルーティングは別図 serving-routing-overview.svg）</text>

  <rect x="48" y="550" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="128" y="573" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">学習済みモデル</text>
  <text x="128" y="591" text-anchor="middle" font-size="10" fill="#6B7280">base / SFT / GRPO</text>

  <rect x="238" y="550" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="343" y="573" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">vLLM 配信</text>
  <text x="343" y="591" text-anchor="middle" font-size="10" fill="#6B7280">OpenAI互換・思考モードは明示的に固定</text>

  <rect x="478" y="550" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="638" y="571" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">S6 評価（自作採点器）</text>
  <text x="638" y="588" text-anchor="middle" font-size="10" fill="#6B7280">3層分離: held-out loss ／ probe ／ 非退行</text>
  <text x="638" y="601" text-anchor="middle" font-size="9.5" fill="#DC2626">閾値で合否(exit 0/2)・差は SE(±0.02) と比べる</text>

  <rect x="828" y="550" width="312" height="56" rx="8" fill="#F0FBF8" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="984" y="571" text-anchor="middle" font-size="12" font-weight="600" fill="#0D9488">合格モデル → アプリ統合へ</text>
  <text x="984" y="590" text-anchor="middle" font-size="9.5" fill="#6B7280">使い分け / ルーティング / フォールバックは別図</text>

  <line x1="208" y1="578" x2="236" y2="578" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="448" y1="578" x2="476" y2="578" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>
  <line x1="798" y1="578" x2="826" y2="578" stroke="#334155" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- held-out callout -->
  <path d="M1050,228 L1160,228 L1160,540 L638,540 L638,548" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="1166" y="380" font-size="10" fill="#DC2626" font-weight="600" transform="rotate(90 1166 380)">held-out は S6 だけが使う</text>

  <!-- ============ BAND 5: 守る ============ -->
  <rect x="28" y="630" width="1124" height="98" rx="10" fill="#F6F1FE" stroke="#E5D8FB"/>
  <rect x="28" y="630" width="6" height="98" rx="3" fill="#7C3AED"/>
  <text x="46" y="652" font-size="13" font-weight="700" fill="#7C3AED">⑤ 守る ｜ S7 ガードレール（NeMo Guardrails）— 入力・取得・出力の3レール ＋ 攻撃検証</text>

  <rect x="48" y="664" width="250" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="173" y="684" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">入力レール（稼働中）</text>
  <text x="173" y="701" text-anchor="middle" font-size="9.5" fill="#6B7280">直接注入 4/4 ・ PII 2/2 を阻止</text>

  <rect x="318" y="664" width="310" height="52" rx="8" fill="#FAF7FF" stroke="#A78BFA" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="473" y="682" text-anchor="middle" font-size="12" font-weight="600" fill="#6D28D9">取得レール（設定済み・未発火）</text>
  <text x="473" y="699" text-anchor="middle" font-size="9.5" fill="#DC2626">RAG 未統合のため間接注入 0/2 で素通り</text>
  <text x="473" y="712" text-anchor="middle" font-size="9" fill="#6B7280">self check facts ／ 次ループの候補</text>

  <rect x="648" y="664" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="793" y="684" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">出力レール（稼働中）</text>
  <text x="793" y="701" text-anchor="middle" font-size="9.5" fill="#6B7280">出典欠落 / 作話 / プロンプト漏洩 / スキーマ</text>

  <rect x="958" y="664" width="182" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="1049" y="682" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">garak ／ Langfuse</text>
  <text x="1049" y="699" text-anchor="middle" font-size="9.5" fill="#6B7280">攻撃ベンチ 92.8%→0%</text>
  <text x="1049" y="712" text-anchor="middle" font-size="9" fill="#DC2626">満点でも穴は残る（自作 9/12）</text>

  <!-- ============ Principles ============ -->
  <g font-size="11.5" font-weight="600">
    <rect x="48" y="742" width="254" height="34" rx="17" fill="#0F766E"/><text x="175" y="764" text-anchor="middle" fill="#FFFFFF">評価ファースト・リーク検査必須</text>
    <rect x="330" y="742" width="254" height="34" rx="17" fill="#1D4ED8"/><text x="457" y="764" text-anchor="middle" fill="#FFFFFF">知識は RAG・形式は SFT</text>
    <rect x="612" y="742" width="254" height="34" rx="17" fill="#D97706"/><text x="739" y="764" text-anchor="middle" fill="#FFFFFF">課金は人間の承認ゲート</text>
    <rect x="894" y="742" width="246" height="34" rx="17" fill="#7C3AED"/><text x="1017" y="764" text-anchor="middle" fill="#FFFFFF">多層防御（OWASP LLM Top10）</text>
  </g>
  <text x="48" y="796" font-size="9.5" fill="#94A3B8">数値は docs/loop-01〜15-report.md の実測。図と実装が食い違ったら実装（Makefile / 各ステージ）を正とする。</text>

  <!-- NeMo library tags (NVIDIA green) -->
  <g fill="#FFFFFF" font-weight="600" text-anchor="middle">
    <rect x="293" y="233" width="120" height="14" rx="7" fill="#76B900"/><text x="353" y="243" font-size="9">NeMo Curator</text>
    <rect x="573" y="233" width="120" height="14" rx="7" fill="#334155"/><text x="633" y="243" font-size="9">Claude API（NeMo外）</text>
    <rect x="95" y="363" width="120" height="14" rx="7" fill="#76B900"/><text x="155" y="373" font-size="9">NeMo Framework</text>
    <rect x="360" y="363" width="80" height="14" rx="7" fill="#76B900"/><text x="400" y="373" font-size="9">NeMo-RL</text>
    <rect x="633" y="363" width="80" height="14" rx="7" fill="#76B900"/><text x="673" y="373" font-size="9">NeMo-RL</text>
    <rect x="252" y="491" width="160" height="14" rx="7" fill="#76B900"/><text x="332" y="501" font-size="9">NeMo Retriever（embed NIM）</text>
    <rect x="722" y="491" width="156" height="14" rx="7" fill="#76B900"/><text x="800" y="501" font-size="9">NeMo Retriever（rerank NIM）</text>
    <rect x="578" y="607" width="120" height="14" rx="7" fill="#334155"/><text x="638" y="617" font-size="9">自作採点器（NeMo外）</text>
    <rect x="800" y="641" width="120" height="14" rx="7" fill="#76B900"/><text x="860" y="651" font-size="9">NeMo Guardrails</text>
  </g>
</svg>
