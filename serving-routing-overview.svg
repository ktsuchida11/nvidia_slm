<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0D9488"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#DC2626"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="1180" height="62" fill="#0D9488"/>
  <text x="28" y="30" fill="#FFFFFF" font-size="20" font-weight="700">使う（推論構成）— 検索 → rerank → 生成 → 品質ゲート</text>
  <text x="28" y="50" fill="#CFF0E9" font-size="12">学習パイプラインとは別の実行時アーキ。知識は RAG が担い、モデルは形式を担う（probe 0.0402 → 0.6332 は検索側の改善で得た）</text>

  <!-- Guardrail frame -->
  <rect x="20" y="80" width="1140" height="356" rx="12" fill="#FBF9FE" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="7 4"/>
  <rect x="36" y="72" width="330" height="20" rx="6" fill="#7C3AED"/>
  <text x="46" y="86" fill="#FFFFFF" font-size="11" font-weight="600">S7 ガードレール：入力 →[処理]→ 出力 を挟む</text>
  <text x="1144" y="98" text-anchor="end" fill="#7C3AED" font-size="10.5">監視 = Langfuse</text>

  <!-- User -->
  <rect x="40" y="218" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">ユーザー質問</text>
  <text x="100" y="262" text-anchor="middle" font-size="10" fill="#6B7280">（入力レール適用）</text>

  <!-- LiteLLM gateway -->
  <rect x="188" y="218" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="263" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">LiteLLM ゲートウェイ</text>
  <text x="263" y="260" text-anchor="middle" font-size="10" fill="#6B7280">全LLM呼び出しの関所</text>

  <rect x="188" y="330" width="150" height="42" rx="6" fill="#ECFBF7" stroke="#C2EFE3"/>
  <text x="263" y="347" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0D9488">ルーティング</text>
  <text x="263" y="362" text-anchor="middle" font-size="9.5" fill="#6B7280">易→ローカル / 難→Claude</text>

  <!-- Query analysis (upper path) -->
  <rect x="376" y="120" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="471" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">クエリ解析（軽量）</text>
  <text x="471" y="159" text-anchor="middle" font-size="9.5" fill="#6B7280">sectors / 日付 / 種別に構造化</text>

  <!-- Retrieval chain (lower path) -->
  <rect x="376" y="286" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="466" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">ベクトル検索</text>
  <text x="466" y="325" text-anchor="middle" font-size="9.5" fill="#6B7280">embedding NIM（dim 2048）</text>
  <text x="466" y="339" text-anchor="middle" font-size="9.5" fill="#6B7280">自前フラット索引 / top k0=100</text>

  <rect x="586" y="286" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="676" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">rerank → top10</text>
  <text x="676" y="325" text-anchor="middle" font-size="9.5" fill="#6B7280">reranking NIM</text>
  <text x="676" y="339" text-anchor="middle" font-size="9.5" fill="#6B7280">文脈は量より質（top5 &gt; k=10）</text>

  <!-- Generation -->
  <rect x="606" y="182" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="696" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">回答生成</text>
  <text x="696" y="224" text-anchor="middle" font-size="9.5" fill="#6B7280">Nemotron 9B（vLLM）＋アダプタ</text>

  <!-- Quality gate -->
  <rect x="838" y="182" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <text x="923" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">品質ゲート（出力レール）</text>
  <text x="923" y="224" text-anchor="middle" font-size="9.5" fill="#6B7280">出典必須 / 作話・漏洩の検査</text>

  <!-- To user -->
  <rect x="838" y="92" width="170" height="54" rx="8" fill="#ECFBF7" stroke="#0D9488" stroke-width="1.5"/>
  <text x="923" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">利用者へ</text>
  <text x="923" y="131" text-anchor="middle" font-size="9.5" fill="#6B7280">出典付き回答</text>

  <!-- Claude fallback -->
  <rect x="838" y="300" width="170" height="60" rx="8" fill="#FFF7ED" stroke="#374151" stroke-width="1.4"/>
  <text x="923" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Claude API</text>
  <text x="923" y="342" text-anchor="middle" font-size="9.5" fill="#6B7280">難ケース / フォールバック</text>

  <!-- Retrieval rail warning -->
  <rect x="376" y="364" width="390" height="56" rx="8" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="571" y="383" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">取得レール（self check facts）— 設定済みだが未発火</text>
  <text x="571" y="399" text-anchor="middle" font-size="9.5" fill="#B91C1C">チャンクに埋め込まれた指示を検査するのはここ。RAG 未統合のため loop15 では動かず</text>
  <text x="571" y="413" text-anchor="middle" font-size="9.5" fill="#B91C1C">結果、間接プロンプトインジェクション 0/2 が素通り（＝次ループの候補）</text>
  <path d="M571,346 L571,362" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#r)"/>

  <!-- arrows -->
  <line x1="160" y1="248" x2="186" y2="248" stroke="#334155" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M338,236 L376,168" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M338,260 L376,300" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="556" y1="316" x2="584" y2="316" stroke="#334155" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M566,148 L606,196" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M700,286 L698,244" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="786" y1="212" x2="836" y2="212" stroke="#334155" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M923,182 L923,148" fill="none" stroke="#0D9488" stroke-width="1.7" marker-end="url(#g)"/>
  <text x="934" y="170" font-size="10" fill="#0D9488" font-weight="600">合格</text>
  <path d="M923,242 L923,298" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="934" y="274" font-size="10" fill="#94A3B8">不合格/難</text>
  <path d="M1008,330 L1020,330 L1020,118 L1010,118" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#b)"/>

  <!-- footnotes -->
  <text x="40" y="462" font-size="10.5" fill="#6B7280">※ 役割分担: 解析=軽量 / 生成=Nemotron 9B（ローカル）/ 難ケース=Claude。品質ゲート不合格やローカル障害時は自動で Claude にフォールバック（2層）。</text>
  <text x="40" y="482" font-size="10.5" fill="#1D4ED8">※ <tspan font-weight="700">検索が律速</tspan>。rerank 導入で probe 0.4724 → 0.6332（歴代最高）。残る失点の主因は <tspan font-weight="700">top100 圏外 16.6%</tspan> ＝ 検索を直すのが次の一手。</text>
  <text x="40" y="502" font-size="10.5" fill="#DC2626">※ <tspan font-weight="700">間接プロンプトインジェクションは入力レールでは防げない</tspan>（loop15 実測 0/2）。参考資料に埋め込まれた指示は通常の質問に見えるため、取得レールの発火が要る。</text>
  <text x="40" y="522" font-size="10.5" fill="#7C3AED">＋（任意）出口ガバナンス：外部呼び出しを OpenShell の privacy router に集約し、宛先allowlist・認証情報分離・監査を"アプリ外"で強制（docs/07・アルファ）。</text>
  <text x="28" y="546" font-size="11" fill="#0D9488" font-weight="600">↑ 学習（作る）と評価は別図「パイプライン全体像（architecture-overview.svg）」を参照。合格した学習済みモデルがこの「回答生成」に載る。</text>
</svg>
